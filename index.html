<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Lyrics for the car</title>
<style>
  :root { --fs: 44px; --accent: #1ed760; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  /* Accent from the album cover; registered so it cross-fades when the song changes. */
  @property --accent { syntax: '<color>'; inherits: true; initial-value: #1ed760; }
  :root { transition: --accent 1.2s; }
  /* Layers behind the app: blurred cover, a dark shade, then the song-reactive scene (#fx). */
  #bgArt { position: fixed; inset: -60px; z-index: 0; background-size: cover; background-position: center;
    filter: blur(60px) saturate(1.5) brightness(.55); transition: background-image .8s; }
  #shade { position: fixed; inset: 0; z-index: 0; background: rgba(0,0,0,.35); }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  #app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 20px; padding: 18px 28px; }
  #art { width: 84px; height: 84px; border-radius: 10px; background: #222; object-fit: cover; flex: none; }
  #meta { flex: 1; min-width: 0; }
  #title { font-size: 30px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #artist { font-size: 22px; opacity: .7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btns { display: flex; gap: 10px; flex: none; }
  button { background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 14px;
    min-width: 64px; height: 64px; font-size: 26px; padding: 0 16px; cursor: pointer; }
  button:active { background: rgba(255,255,255,.28); }
  #lyrics { flex: 1; overflow-y: auto; padding: 30vh 48px 45vh; scroll-behavior: smooth;
    scrollbar-width: none; -webkit-mask-image: linear-gradient(transparent, #000 12%, #000 88%, transparent); }
  #lyrics::-webkit-scrollbar { display: none; }
  /* Dimmed lines are 0.8x so more upcoming lines fit under the (lower) current line. */
  .line { font-size: calc(var(--fs) * .8); font-weight: 800; line-height: 1.3; margin: 0 0 .55em;
    opacity: .22; transition: opacity .3s, font-size .3s cubic-bezier(.2,.8,.2,1); cursor: pointer; }
  .line.past { opacity: .16; }
  /* Real font-size (not transform) so the big line reflows: no overlap, wraps across the full width. */
  .line { text-shadow: 0 2px 14px rgba(0,0,0,.45); }
  .line.active { opacity: 1; font-size: calc(var(--fs) * 1.5); animation: pop .45s cubic-bezier(.2,1.6,.4,1);
    text-shadow: 0 0 26px color-mix(in srgb, var(--accent) 75%, transparent), 0 2px 14px rgba(0,0,0,.5); }
  .line { transform-origin: left center; }
  /* Each vibe pops the current line differently (set on <body data-vibe>). */
  @keyframes pop { 0% { transform: translateY(18px) scale(.9); } 60% { transform: translateY(-6px) scale(1.03); } 100% { transform: none; } }
  @keyframes drop { 0% { transform: scale(1.32); filter: brightness(2.4) blur(3px); }
    45% { transform: scale(.97); filter: brightness(1.4); } 100% { transform: none; filter: none; } }
  @keyframes slam { 0% { transform: translateY(-46px) scale(1.18); opacity: .3; }
    50% { transform: translateY(5px) scaleY(.9); opacity: 1; } 72% { transform: translateY(-3px); } 100% { transform: none; } }
  @keyframes jolt { 0% { transform: rotate(-5deg) translateX(-22px) scale(1.1); } 30% { transform: rotate(3deg) translateX(9px); }
    55% { transform: rotate(-1.5deg) translateX(-3px); } 100% { transform: none; } }
  @keyframes kick { 0% { transform: translateX(-28px) scale(1.07); } 50% { transform: translateX(7px) scale(1.01); } 100% { transform: none; } }
  @keyframes punch { 0% { transform: translateX(-70px) skewX(-14deg); opacity: .4; }
    65% { transform: translateX(5px) skewX(3deg); opacity: 1; } 100% { transform: none; } }
  @keyframes glide { 0% { transform: translateY(12px); opacity: .35; filter: blur(2px); } 100% { transform: none; opacity: 1; filter: none; } }
  @keyframes bloom { 0% { transform: translateY(22px); opacity: 0; filter: blur(9px); } 100% { transform: none; opacity: 1; filter: none; } }
  [data-vibe="club"]   .line.active { animation: drop .5s cubic-bezier(.2,.9,.3,1); }
  [data-vibe="metal"]  .line.active { animation: slam .55s cubic-bezier(.3,.9,.3,1); }
  [data-vibe="punk"]   .line.active { animation: jolt .4s ease-out; }
  [data-vibe="rock"]   .line.active { animation: kick .4s cubic-bezier(.2,1.2,.4,1); }
  [data-vibe="hiphop"] .line.active { animation: punch .32s cubic-bezier(.2,.9,.3,1.1); }
  [data-vibe="chill"]  .line.active { animation: glide .8s ease-out; }
  [data-vibe="mellow"] .line.active { animation: bloom 1.2s cubic-bezier(.2,.7,.2,1); }
  #vibe { display: inline-block; margin-top: 6px; font-size: 18px; padding: 3px 12px; border-radius: 999px;
    background: rgba(255,255,255,.14); cursor: pointer; user-select: none; }
  /* Climax (final chorus): the current line gets bigger and takes on the vibe's look; the rest fades back. */
  body.climax .line.active { font-size: calc(var(--fs) * 1.7); }
  body.climax .line:not(.active) { opacity: .1; }
  .line > span { transition: letter-spacing 1.2s ease; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  @keyframes breathe { 50% { text-shadow: 0 0 46px var(--accent), 0 0 18px var(--accent), 0 2px 14px rgba(0,0,0,.5); } }
  @keyframes heat { 50% { text-shadow: 0 0 34px hsl(14 100% 55%), 0 0 12px hsl(40 100% 60%), 0 2px 14px rgba(0,0,0,.6); } }
  .climax[data-vibe="pop"] .line.active > span, .climax[data-vibe="hiphop"] .line.active > span {
    background: linear-gradient(90deg, #fff 0%, var(--accent) 25%, #fff 50%, var(--accent) 75%, #fff 100%);
    background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    animation: shimmer 2.4s linear infinite; }
  .climax[data-vibe="hiphop"] .line.active > span {
    background-image: linear-gradient(90deg, #fff6d5 0%, hsl(45 100% 60%) 25%, #fff6d5 50%, hsl(38 100% 55%) 75%, #fff6d5 100%); }
  .climax[data-vibe="club"]   .line.active > span { animation: breathe .55s ease-in-out infinite; }
  .climax[data-vibe="metal"]  .line.active > span { animation: heat .8s ease-in-out infinite; }
  .climax[data-vibe="punk"]   .line.active > span { text-shadow: 4px 3px 0 hsl(330 100% 62%), -3px -2px 0 hsl(80 100% 55%); }
  .climax[data-vibe="rock"]   .line.active > span { text-shadow: 0 0 30px #fff, 0 0 60px hsl(42 100% 75%), 0 2px 14px rgba(0,0,0,.5); }
  .climax[data-vibe="chill"]  .line.active > span { animation: breathe 3s ease-in-out infinite; }
  .climax[data-vibe="mellow"] .line.active > span { letter-spacing: .04em; text-shadow: 0 0 30px hsl(30 100% 70%), 0 2px 14px rgba(0,0,0,.5); }
  @media (prefers-reduced-motion: reduce) { .line.active, .line.active > span { animation: none !important; } }
  .plain .line { opacity: .9; cursor: default; }
  .msg { font-size: 30px; opacity: .6; text-align: center; margin-top: 12vh; animation: fadeUp .5s ease-out both; }
  /* Song changes: old lyrics and title slide out, the new song slides in. */
  #lyrics, #meta, #art { transition: opacity .26s ease, transform .26s ease; }
  #lyrics.switching { opacity: 0; transform: translateY(-26px); }
  #meta.swap, #art.swap { opacity: 0; transform: translateY(8px); }
  #lyrics.entering .line:not(.active) { animation: fadeUp .5s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 45ms); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(22px); } }
  /* Loader: equalizer bars in the album's colour (only shown if lyrics take a moment). */
  .loader { display: flex; gap: 8px; align-items: flex-end; height: 46px; margin: 14vh 0 0 4px; animation: fadeUp .3s ease-out both; }
  .loader i { width: 9px; height: 100%; border-radius: 5px; background: var(--accent); transform-origin: bottom;
    animation: eq 0.9s ease-in-out infinite; }
  .loader i:nth-child(2) { animation-delay: -.3s; } .loader i:nth-child(3) { animation-delay: -.6s; } .loader i:nth-child(4) { animation-delay: -.15s; }
  @keyframes eq { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
  #bar { height: 5px; background: rgba(255,255,255,.15); }
  #bar > div { height: 100%; width: 0; background: var(--accent); }
  footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 28px 20px; }
  footer .group { display: flex; gap: 10px; align-items: center; }
  #offsetLabel { font-size: 20px; opacity: .8; min-width: 110px; text-align: center; }
  #setup { max-width: 760px; margin: 8vh auto; padding: 0 32px; font-size: 22px; line-height: 1.5; }
  #setup h1 { font-size: 40px; }
  #setup input { width: 100%; font-size: 24px; padding: 16px; border-radius: 12px; border: 0; margin: 8px 0 18px; }
  #setup code { background: rgba(255,255,255,.12); padding: 2px 8px; border-radius: 6px; word-break: break-all; }
  .primary { background: var(--accent); color: #000; font-weight: 700; width: 100%; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="bgArt"></div><div id="shade"></div><canvas id="fx"></canvas>

<div id="setup" class="hidden">
  <h1>Lyrics for the car</h1>
  <p>One-time setup:</p>
  <ol>
    <li>Go to <code>developer.spotify.com/dashboard</code> and create an app (any name).</li>
    <li>Add this exact Redirect URI:<br><code id="redirectUri"></code></li>
    <li>Tick "Web API" and save, then paste the app's <b>Client ID</b> below.</li>
  </ol>
  <input id="clientId" placeholder="Spotify Client ID" autocomplete="off" spellcheck="false">
  <button class="primary" id="connect">Connect Spotify</button>
  <p id="setupErr" style="color:#ff7b7b"></p>
</div>

<div id="app" class="hidden">
  <header>
    <img id="art" alt="">
    <div id="meta"><div id="title">Nothing playing</div><div id="artist">Start a song on Spotify</div><div id="vibe" class="hidden" title="Tap to change the style"></div></div>
    <div class="btns">
      <button id="prev" title="Previous">⏮</button>
      <button id="play" title="Play/Pause">⏯</button>
      <button id="next" title="Next">⏭</button>
    </div>
  </header>
  <div id="bar"><div></div></div>
  <div id="lyrics"><div class="msg">Waiting for Spotify…</div></div>
  <footer>
    <div class="group">
      <button id="smaller" title="Smaller text">A−</button>
      <button id="bigger" title="Bigger text">A+</button>
    </div>
    <div class="group">
      <button id="earlier" title="Lyrics earlier">−0.5s</button>
      <span id="offsetLabel">sync 0.0s</span>
      <button id="later" title="Lyrics later">+0.5s</button>
    </div>
    <div class="group">
      <button id="follow" title="Jump back to current line">⤓</button>
      <button id="logout" title="Disconnect">⏻</button>
    </div>
  </footer>
</div>

<script>
(() => {
  const SCOPES = 'user-read-currently-playing user-read-playback-state user-modify-playback-state';
  const REDIRECT = location.origin + location.pathname;
  const $ = id => document.getElementById(id);
  const store = {
    get: k => localStorage.getItem('tl_' + k),
    set: (k, v) => localStorage.setItem('tl_' + k, v),
    del: k => localStorage.removeItem('tl_' + k),
  };

  // ---------- Spotify auth (PKCE, no server needed) ----------
  const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const randStr = n => b64url(crypto.getRandomValues(new Uint8Array(n)));

  async function startLogin(clientId) {
    const verifier = randStr(64);
    const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
    store.set('client_id', clientId);
    store.set('verifier', verifier);
    const state = randStr(16);
    store.set('state', state);
    const p = new URLSearchParams({ client_id: clientId, response_type: 'code', redirect_uri: REDIRECT,
      code_challenge_method: 'S256', code_challenge: challenge, scope: SCOPES, state });
    location.href = 'https://accounts.spotify.com/authorize?' + p;
  }

  async function tokenRequest(params) {
    const r = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ client_id: store.get('client_id'), ...params }) });
    if (!r.ok) throw new Error('Spotify login failed (' + r.status + ')');
    const t = await r.json();
    store.set('access', t.access_token);
    store.set('expires', String(Date.now() + (t.expires_in - 60) * 1000));
    if (t.refresh_token) store.set('refresh', t.refresh_token);
  }

  async function accessToken() {
    if (Date.now() > Number(store.get('expires') || 0)) {
      await tokenRequest({ grant_type: 'refresh_token', refresh_token: store.get('refresh') });
    }
    return store.get('access');
  }

  async function spotify(path, method = 'GET') {
    const r = await fetch('https://api.spotify.com/v1' + path, { method,
      headers: { Authorization: 'Bearer ' + await accessToken() } });
    if (r.status === 401) { store.set('expires', '0'); return null; }
    if (r.status === 204 || method !== 'GET') return null;
    return r.ok ? r.json() : null;
  }

  // ---------- Lyrics (LRCLIB, fetched live) ----------
  const lyricCache = new Map();
  function parseLRC(text) {
    const out = [];
    for (const raw of text.split('\n')) {
      const tags = [...raw.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
      if (!tags.length) continue;
      const words = raw.replace(/\[[^\]]*\]/g, '').trim();
      for (const m of tags) out.push({ t: (Number(m[1]) * 60 + Number(m[2])) * 1000, text: words || '♪' });
    }
    return out.sort((a, b) => a.t - b.t);
  }
  async function fetchLyrics(track) {
    if (lyricCache.has(track.id)) return lyricCache.get(track.id);
    const artist = track.artists[0]?.name || '';
    const base = 'https://lrclib.net/api/';
    let hit = null;
    try {
      const r = await fetch(base + 'get?' + new URLSearchParams({ track_name: track.name, artist_name: artist,
        album_name: track.album?.name || '', duration: Math.round(track.duration_ms / 1000) }));
      if (r.ok) hit = await r.json();
      if (!hit || (!hit.syncedLyrics && !hit.plainLyrics && !hit.instrumental)) {
        const s = await fetch(base + 'search?' + new URLSearchParams({ track_name: track.name, artist_name: artist }));
        const list = s.ok ? await s.json() : [];
        const dur = track.duration_ms / 1000;
        list.sort((a, b) => (!!b.syncedLyrics - !!a.syncedLyrics) || Math.abs(a.duration - dur) - Math.abs(b.duration - dur));
        hit = list.find(x => Math.abs(x.duration - dur) < 8) || list[0] || null;
      }
    } catch (e) { return { error: true }; }
    const res = !hit ? { none: true }
      : hit.instrumental ? { instrumental: true }
      : hit.syncedLyrics ? { synced: parseLRC(hit.syncedLyrics) }
      : hit.plainLyrics ? { plain: hit.plainLyrics.split('\n') }
      : { none: true };
    lyricCache.set(track.id, res);
    return res;
  }

  // ---------- UI state ----------
  let fs = Number(store.get('fs') || 44);
  let offset = Number(store.get('offset') || 0);
  let state = { trackId: null, progress: 0, at: 0, playing: false, duration: 1 };
  let lines = null, lineEls = [], activeIdx = -1, follow = true, lastAutoScroll = 0;

  const applyFs = () => { document.documentElement.style.setProperty('--fs', fs + 'px'); store.set('fs', fs); };
  const applyOffset = () => { $('offsetLabel').textContent = 'sync ' + (offset > 0 ? '+' : '') + (offset / 1000).toFixed(1) + 's'; store.set('offset', offset); };

  function showMsg(text) {
    lines = null; lineEls = []; activeIdx = -1;
    setClimax(false);
    $('lyrics').className = '';
    $('lyrics').innerHTML = '';
    const d = document.createElement('div'); d.className = 'msg'; d.textContent = text;
    $('lyrics').appendChild(d);
  }

  // Climax: the last chorus in the second half of the song (the big final chorus).
  // Songs with no repeated lines fall back to their busiest 25 s stretch between 55% and 92%.
  function markClimax(ls) {
    for (const l of ls) { l.climax = false; l.climaxStart = false; }
    if (ls.length < 8) return;
    const end = ls[ls.length - 1].t;
    if (end < 45000) return;
    // Chorus blocks: runs of chorus lines, allowing one non-chorus line inside a block.
    const blocks = []; let cur = null, gap = 0;
    ls.forEach((l, i) => {
      if (l.chorus) { if (!cur) cur = { a: i, b: i }; else cur.b = i; gap = 0; }
      else if (cur && ++gap > 1) { blocks.push(cur); cur = null; gap = 0; }
    });
    if (cur) blocks.push(cur);
    const late = blocks.filter(x => ls[x.a].t >= end * 0.5 && x.b > x.a);
    let a = -1, b = -1;
    if (late.length) ({ a, b } = late[late.length - 1]);
    else {
      let best = 0;
      for (let i = 0; i < ls.length; i++) {
        if (ls[i].t < end * 0.55 || ls[i].t > end * 0.92) continue;
        let j = i; while (j + 1 < ls.length && ls[j + 1].t - ls[i].t < 25000) j++;
        if (j - i > best) { best = j - i; a = i; b = j; }
      }
      if (best < 3) return;
    }
    for (let i = a; i <= b; i++) ls[i].climax = true;
    ls[a].climaxStart = true;
  }

  let climaxOn = false;
  function setClimax(on) {
    if (on === climaxOn) return;
    climaxOn = on;
    document.body.classList.toggle('climax', on);
    fx.setClimax(on);
  }

  function showLoader() {
    lines = null; lineEls = []; activeIdx = -1;
    $('lyrics').className = '';
    $('lyrics').innerHTML = '<div class="loader" aria-label="Loading lyrics"><i></i><i></i><i></i><i></i></div>';
  }

  function renderLyrics(res) {
    const box = $('lyrics'); box.innerHTML = ''; activeIdx = -1; lineEls = [];
    setClimax(false);
    if (res.error) return showMsg('Couldn’t reach the lyrics service.');
    if (res.instrumental) return showMsg('♪ Instrumental ♪');
    if (res.none) return showMsg('No lyrics found for this song.');
    const arr = res.synced || res.plain.map(text => ({ text }));
    box.className = res.synced ? '' : 'plain';
    lines = res.synced || null;
    if (lines) {
      // Lines that come back 2+ times are almost always the chorus: the scene goes bigger on those.
      const norm = s => (s || '').toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
      const counts = new Map();
      for (const l of lines) { const k = norm(l.text); if (k.length > 3) counts.set(k, (counts.get(k) || 0) + 1); }
      for (const l of lines) l.chorus = (counts.get(norm(l.text)) || 0) >= 2;
      markClimax(lines);
      // Singing pace = typical gap between lines; drives how fast the scene moves.
      const gaps = lines.slice(1).map((l, k) => l.t - lines[k].t).filter(g => g > 300 && g < 15000).sort((a, b) => a - b);
      fx.setPace(gaps.length ? gaps[gaps.length >> 1] : 3500);
    }
    for (const l of arr) {
      const d = document.createElement('div');
      d.className = 'line';
      if (lineEls.length < 10) d.style.setProperty('--i', lineEls.length); // stagger for the entrance
      const s = document.createElement('span'); s.textContent = l.text || ' '; d.appendChild(s);
      if (res.synced) d.onclick = () => seekTo(l.t);
      box.appendChild(d); lineEls.push(d);
    }
    box.scrollTop = 0; follow = true;
  }

  // ---------- Vibes: how each kind of song pops ----------
  // `anim` picks the CSS pop animation for the current line (body[data-vibe]); the rest tune the scene.
  const VIBES = {
    pop:    { label: '✨ Pop', sparks: 12, chorusSparks: 30, power: 1, gravity: 40, flash: 0, shake: 0, motes: 1 },
    club:   { label: '🪩 Club', sparks: 18, chorusSparks: 36, power: 1.5, gravity: 8, flash: .16, shake: 0, motes: 1.6,
              beams: .55, beamSpeed: 2.4, doubleRing: true, ring: 4,
              colours: ['hsl(190 100% 62%)', 'hsl(300 100% 66%)', 'hsl(55 100% 60%)'] },
    metal:  { label: '🤘 Metal', sparks: 26, chorusSparks: 46, power: 1.7, gravity: 170, flash: .06, shake: 10, motes: .7,
              ring: 6, sparkSize: 1.2, colours: ['hsl(14 100% 55%)', 'hsl(32 100% 55%)', 'hsl(0 90% 50%)'] },
    punk:   { label: '⚡ Punk', sparks: 18, chorusSparks: 34, power: 1.35, gravity: 90, flash: .04, shake: 5, motes: 1.1,
              ring: 5, colours: ['hsl(330 100% 62%)', 'hsl(80 100% 55%)'] },
    rock:   { label: '🎸 Rock', sparks: 16, chorusSparks: 32, power: 1.25, gravity: 80, flash: 0, shake: 3.5, motes: 1, ring: 4 },
    hiphop: { label: '🎤 Hip-hop', sparks: 10, chorusSparks: 24, power: 1.15, gravity: 60, flash: 0, shake: 2.5, motes: .9,
              doubleRing: true, ring: 5 },
    chill:  { label: '🌙 Chill', sparks: 4, chorusSparks: 10, power: .55, gravity: -6, flash: 0, shake: 0, motes: .7, sparkLife: 1.8 },
    mellow: { label: '🥀 Mellow', sparks: 3, chorusSparks: 8, power: .45, gravity: -14, flash: 0, shake: 0, motes: .5,
              sparkLife: 2.4, sparkSize: .8 },
  };
  const VIBE_ORDER = Object.keys(VIBES);
  // What the scene adds during each vibe's climax (the final chorus).
  const CLIMAX_FX = { pop: 'confetti', club: 'lasers', metal: 'embers', punk: 'bolts',
    rock: 'spotlight', hiphop: 'gold', chill: 'aurora', mellow: 'petals' };
  for (const k of VIBE_ORDER) VIBES[k].climaxFx = CLIMAX_FX[k];

  // Genres come from MusicBrainz tags (detailed, e.g. "pop punk", "progressive house") with the
  // iTunes genre (broad, but almost always there) as backup; Spotify no longer shares genres.
  const genreCache = JSON.parse(localStorage.getItem('tl_genres') || '{}');
  async function genreInfo(track) {
    const a = track.artists[0];
    if (!a) return { tags: [], it: '' };
    if (genreCache[a.id]) return genreCache[a.id];
    const [tags, it] = await Promise.all([
      fetch('https://musicbrainz.org/ws/2/artist/?' + new URLSearchParams({ query: `artist:"${a.name}"`, fmt: 'json', limit: 3 }))
        .then(r => r.ok ? r.json() : null)
        .then(j => {
          const m = j?.artists?.find(x => x.name.toLowerCase() === a.name.toLowerCase());
          return (m?.tags || []).sort((x, y) => y.count - x.count).slice(0, 8).map(x => x.name.toLowerCase());
        }).catch(() => []),
      fetch('https://itunes.apple.com/search?' + new URLSearchParams({ term: a.name + ' ' + track.name, entity: 'song', limit: 1 }))
        .then(r => r.ok ? r.json() : null)
        .then(j => (j?.results?.[0]?.primaryGenreName || '').toLowerCase()).catch(() => ''),

  }

  // Genre decides the family; singing pace (ms between lyric lines) decides between energetic and mellow.
  // Each tag votes for every family it matches, weighted by its rank (MusicBrainz lists the most
  // agreed-on tags first), so "pop, pop rock, pop soul" lands on pop rather than soul.
  // The third value boosts specific scenes over umbrella labels: "pop punk, alternative rock, emo"
  // should read as punk, not as generic rock.
  const FAMILIES = [
    ['metal',  /metal|deathcore|grindcore|djent/, 1.6],
    ['club',   /\bedm\b|house|techno|trance|dubstep|drum and bass|hardstyle|electro|\bdance\b|club|electronic/, 1.2],
    ['punk',   /punk|grunge|post-hardcore|hardcore|\bemo\b/, 1.5],
    ['hiphop', /hip hop|hip-hop|\brap\b|trap|drill|grime/, 1.3],
    ['chill',  /lo-fi|lofi|jazz|r&b|rnb|soul|chill|ambient|bossa|city pop/, 1],
    ['mellow', /sad|ballad|slowcore|acoustic|folk|singer|bedroom pop|melanchol/, 1],
    ['rock',   /rock|alternative/, 0.8],
    ['pop',    /pop/, 0.8],

    const score = {};
    const vote = (tag, w) => { for (const [f, re, boost] of FAMILIES) if (re.test(tag)) score[f] = (score[f] || 0) + w * boost; };
    tags.forEach((tag, i) => vote(tag, 1 / (1 + i * 0.6)));
    if (it) vote(it, 0.8);
    let fam = Object.keys(score).sort((a, b) => score[b] - score[a])[0] || 'pop';
    // Singing pace splits energetic from mellow within a family.
    const slow = pace > 4300, fast = pace < 2700;
    if (fam === 'club' && slow) fam = 'chill';
    if (fam === 'punk' && tags.some(x => /\bemo\b/.test(x)) && !fast) fam = 'mellow';
    if ((fam === 'pop' || fam === 'rock') && slow) fam = 'mellow'; // slow pop/rock is usually a ballad
    if (fam === 'chill' && pace > 5000) fam = 'mellow';            // very slow soul/R&B: a ballad too
    if (fam === 'mellow' && fast) fam = 'pop';
    return fam;
  }

  let vibeKey = 'pop';
  const vibeOverride = {}; // trackId -> vibe the user picked by tapping the badge
  function setVibe(key) {
    vibeKey = VIBES[key] ? key : 'pop';
    document.body.dataset.vibe = vibeKey;
    $('vibe').textContent = VIBES[vibeKey].label;
    $('vibe').classList.remove('hidden');
    fx.setVibe(VIBES[vibeKey]);
  }

  // ---------- Song-reactive scene ----------
  // The album cover spins on a record (33⅓ rpm while playing, coasting to a stop on pause).
  // Every new lyric line sends a light pulse and a spray of sparks in the cover's colours; the
  // chorus (lines that repeat) brings out sweeping stage lights and more sparks; ambient specks
  // drift up at the song's singing pace.
  const fx = (() => {
    const cv = $('fx'), ctx = cv.getContext('2d');

    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const DEFAULT = ['hsl(141 74% 48%)', 'hsl(262 100% 71%)', 'hsl(336 100% 71%)', 'hsl(197 100% 71%)'];
    const RPM = 33.333 / 60 * Math.PI * 2;
    const withAlpha = (c, a) => c.replace(')', ` / ${a.toFixed(3)})`);
    let W = 0, H = 0, palette = DEFAULT, label = null, rec = null, recR = 0, dirty = true;
    let angle = 0, spin = 0, pulse = 0, hype = 0, hypeTarget = 0, pace = 3500, phase = 0, moteAcc = 0;
    const sparks = [], rings = [], motes = [];
    const pick = () => palette[(Math.random() * palette.length) | 0];
    const resize = () => { W = cv.width = Math.round(innerWidth * SCALE); H = cv.height = Math.round(innerHeight * SCALE); dirty = true; };
    resize(); addEventListener('resize', resize);

    // Record sits in the bottom-right corner, partly off screen, so the lyrics keep the stage.
    const disc = () => { const r = Math.min(W, H) * 0.46; return { x: W - r * 0.55, y: H - r * 0.62, r }; };

    function buildRecord(r) {
      recR = r; dirty = false;
      const s = Math.ceil(r * 2) + 2; rec = document.createElement('canvas'); rec.width = rec.height = s;
      const g = rec.getContext('2d'); g.translate(s / 2, s / 2);
      g.fillStyle = '#0a0a0c'; g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill();
      g.strokeStyle = 'rgba(255,255,255,.055)'; g.lineWidth = 1;
      for (let rr = r * 0.4; rr < r * 0.97; rr += Math.max(2, r / 42)) { g.beginPath(); g.arc(0, 0, rr, 0, 7); g.stroke(); }
      g.strokeStyle = 'rgba(255,255,255,.14)'; g.lineWidth = 2; g.beginPath(); g.arc(0, 0, r * 0.985, 0, 7); g.stroke();
      g.save(); g.beginPath(); g.arc(0, 0, r * 0.36, 0, 7); g.clip();
      if (label) g.drawImage(label, -r * 0.36, -r * 0.36, r * 0.72, r * 0.72); else { g.fillStyle = palette[0]; g.fill(); }
      g.restore();

    }

    let vibe = VIBES.pop, flash = 0, shake = 0;
    let climax = 0, climaxTarget = 0, pieceAcc = 0, boltTimer = 0;
    const pieces = [], bolts = [];

    // ---- Climax effects (one per vibe) ----
    const GOLD = ['hsl(45 100% 60%)', 'hsl(38 100% 55%)', 'hsl(50 100% 75%)'];
    const FIRE = ['hsl(14 100% 55%)', 'hsl(28 100% 55%)', 'hsl(45 100% 60%)'];
    function newPiece(kind) {
      const r = Math.random;
      if (kind === 'embers') return { kind, x: r() * W, y: H + 6, vx: (r() - .5) * 20, vy: -(70 + r() * 110) * SCALE * 2,
        size: 1 + r() * 2.6, life: 2 + r() * 2, col: FIRE[(r() * 3) | 0], ph: r() * 6 };
      if (kind === 'petals') return { kind, x: r() * W, y: -10, vx: (r() - .5) * 12, vy: (14 + r() * 18) * SCALE * 2,
        size: 3 + r() * 4, life: 9, col: pick(), ph: r() * 6, rot: r() * 6, vr: (r() - .5) * 1.5 };
      if (kind === 'gold') return { kind, x: r() * W, y: -10, vx: 0, vy: (40 + r() * 60) * SCALE * 2,
        size: 1.5 + r() * 2.5, life: 6, col: GOLD[(r() * 3) | 0], ph: r() * 6 };
      return { kind: 'confetti', x: r() * W, y: -10, vx: (r() - .5) * 40, vy: (50 + r() * 80) * SCALE * 2,
        w: 4 + r() * 5, h: 2 + r() * 3, life: 7, col: pick(), ph: r() * 6, rot: r() * 6, vr: (r() - .5) * 8 };
    }
    function bolt() { // jagged lightning from the top edge
      const pts = []; let x = W * (0.1 + Math.random() * 0.8), y = 0;
      while (y < H * (0.45 + Math.random() * 0.3)) { pts.push([x, y]); x += (Math.random() - .5) * W * 0.07; y += H * (0.05 + Math.random() * 0.06); }
      pts.push([x, y]);
      bolts.push({ pts, life: 0.28, col: vibe.colours ? vibe.colours[(Math.random() * vibe.colours.length) | 0] : pick() });
    }
    function drawClimax(dt, d) {
      const k = climax, kind = vibe.climaxFx;
      // Falling / rising pieces.
      const rate = { confetti: 45, petals: 7, embers: 50, gold: 22 }[kind] || 0;
      pieceAcc += dt * rate * k;
      while (pieceAcc > 1 && pieces.length < 220) { pieceAcc--; pieces.push(newPiece(kind)); }
      if (pieceAcc > 1) pieceAcc = 1;
      for (let i = pieces.length - 1; i >= 0; i--) {
        const p = pieces[i]; p.life -= dt; p.ph += dt;
        p.x += (p.vx + Math.sin(p.ph * 2) * (p.kind === 'petals' ? 18 : 6)) * dt; p.y += p.vy * dt;
        if (p.rot !== undefined) p.rot += p.vr * dt;
        if (p.life <= 0 || p.y > H + 20 || p.y < -20) { pieces.splice(i, 1); continue; }
        const a = Math.min(1, p.life) * (p.kind === 'embers' ? 0.5 + 0.5 * Math.sin(p.ph * 9) : 1);
        ctx.save(); ctx.translate(p.x, p.y);
        if (p.kind === 'confetti') { ctx.rotate(p.rot); ctx.scale(1, Math.cos(p.ph * 4)); ctx.fillStyle = withAlpha(p.col, 0.85 * a); ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); }
        else if (p.kind === 'petals') { ctx.rotate(p.rot); ctx.fillStyle = withAlpha(p.col, 0.45 * a); ctx.beginPath(); ctx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, 7); ctx.fill(); }
        else { ctx.fillStyle = withAlpha(p.col, 0.3 * a); ctx.beginPath(); ctx.arc(0, 0, p.size * 2.6, 0, 7); ctx.fill();
               ctx.fillStyle = withAlpha(p.col, 0.95 * a); ctx.beginPath(); ctx.arc(0, 0, p.size, 0, 7); ctx.fill(); }
        ctx.restore();
      }
      if (kind === 'lasers') { // thin beams criss-crossing from the top corners
        ctx.lineWidth = 2;
        for (let i = 0; i < 6; i++) {
          const fromLeft = i % 2 === 0, ox = fromLeft ? 0 : W;
          const ang = (fromLeft ? 0.35 : Math.PI - 0.35) + Math.sin(phase * 2.6 + i * 1.7) * 0.45 * (fromLeft ? 1 : -1);
          const col = vibe.colours[i % vibe.colours.length];
          ctx.strokeStyle = withAlpha(col, 0.55 * k); ctx.beginPath(); ctx.moveTo(ox, 0);
          ctx.lineTo(ox + Math.cos(ang) * W * 1.6, Math.sin(ang) * W * 1.6); ctx.stroke();
        }
      }
      if (kind === 'embers') { // hot glow pulsing up from the bottom edge
        const g = ctx.createLinearGradient(0, H, 0, H * 0.45);
        g.addColorStop(0, withAlpha(FIRE[0], (0.32 + 0.12 * Math.sin(phase * 7)) * k)); g.addColorStop(1, withAlpha(FIRE[0], 0));
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      }
      if (kind === 'bolts') {
        boltTimer -= dt; if (boltTimer <= 0) { bolt(); boltTimer = 1.2 + Math.random() * 1.6; }
      }
      for (let i = bolts.length - 1; i >= 0; i--) {
        const b = bolts[i]; b.life -= dt; if (b.life <= 0) { bolts.splice(i, 1); continue; }
        const a = b.life / 0.28;
        for (const [w, al, c] of [[7, 0.25, b.col], [2.2, 0.95, 'hsl(0 0% 100%)']]) {
          ctx.lineWidth = w; ctx.strokeStyle = withAlpha(c, al * a); ctx.beginPath();
          b.pts.forEach(([x, y], j) => j ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
        }
      }
      if (kind === 'spotlight') { // warm spotlight swinging over the lyrics
        const sx = W * 0.32 + Math.sin(phase * 0.9) * W * 0.12, half = W * 0.26;
        const g = ctx.createLinearGradient(sx, 0, sx, H);
        g.addColorStop(0, `hsl(42 100% 85% / ${(0.30 * k).toFixed(3)})`); g.addColorStop(1, 'hsl(42 100% 85% / 0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(sx - 10, 0); ctx.lineTo(sx + 10, 0);
        ctx.lineTo(sx + half, H); ctx.lineTo(sx - half, H); ctx.closePath(); ctx.fill();
      }
      if (kind === 'aurora') { // soft waving bands across the top
        for (let i = 0; i < 3; i++) {

          ctx.fillStyle = withAlpha(col, 0.13 * k); ctx.beginPath(); ctx.moveTo(0, 0);
          for (let x = 0; x <= W; x += W / 24) ctx.lineTo(x, base + Math.sin(x / W * 5 + phase * (0.8 + i * 0.3) + i) * H * 0.06);

        }
      }
      if (kind === 'petals') { // warm glow over the whole scene
        const g = ctx.createRadialGradient(W * 0.4, H * 0.45, 0, W * 0.4, H * 0.45, W * 0.7);
        g.addColorStop(0, `hsl(30 100% 70% / ${(0.10 * k).toFixed(3)})`); g.addColorStop(1, 'hsl(30 100% 70% / 0)');

    }
    const app = $('app');

    function burst(n, power) {
      if (still) return;
      const d = disc(), cols = vibe.colours ? [...palette, ...vibe.colours, ...vibe.colours] : palette;
      for (let k = 0; k < n && sparks.length < 160; k++) {
        const a = Math.PI * (1.0 + Math.random() * 0.62); // fan out up and to the left, over the screen
        const v = (90 + Math.random() * 170) * power * SCALE * 2;
        const life = (1 + Math.random() * 0.9) * (vibe.sparkLife || 1);
        sparks.push({ x: d.x + Math.cos(a) * d.r * 0.95, y: d.y + Math.sin(a) * d.r * 0.95,
          vx: Math.cos(a) * v, vy: Math.sin(a) * v, life, max: life, g: vibe.gravity,
          size: (1.5 + Math.random() * 3) * (vibe.sparkSize || 1), col: cols[(Math.random() * cols.length) | 0] });
      }
    }

    function frame(now) {
      const dt = Math.min(0.05, (now - (frame.last || now)) / 1000); frame.last = now;
      const playing = !!state.playing;
      const speed = Math.max(0.6, Math.min(1.8, 3500 / pace)) * (playing ? 1 : 0.3);
      spin += ((playing && !still ? RPM : 0) - spin) * Math.min(1, dt * (playing ? 2.5 : 1.1));
      angle += spin * dt;
      pulse = Math.max(0, pulse - dt * 1.5);
      hype += (hypeTarget - hype) * Math.min(1, dt * 1.4);
      climax += (climaxTarget - climax) * Math.min(1, dt * 1.2);
      phase += dt * speed * 0.7;

      ctx.clearRect(0, 0, W, H);
      const d = disc();
      if (dirty || Math.abs(d.r - recR) > 1) buildRecord(d.r);

      ctx.globalCompositeOperation = 'lighter';
      // Glow behind the record: breathes with each line, brighter in the chorus.
      const gr = d.r * (1.55 + 0.25 * pulse + 0.2 * hype);
      const glow = ctx.createRadialGradient(d.x, d.y, d.r * 0.5, d.x, d.y, gr);
      glow.addColorStop(0, withAlpha(palette[0], 0.22 + 0.4 * pulse + 0.18 * hype));
      glow.addColorStop(1, withAlpha(palette[0], 0));
      ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

      // Stage lights sweeping down from the top: chorus only, or all the time for club tracks.
      const beam = Math.max(hype, vibe.beams || 0, climax);
      if (beam > 0.02 && !still) {
        for (let k = 0; k < 3; k++) {

          const len = H * 1.3, ex = x0 + Math.sin(sway) * len, ey = Math.cos(sway) * len, w = W * 0.09;
          const col = vibe.colours ? vibe.colours[k % vibe.colours.length] : palette[(k + 1) % palette.length];
          const g = ctx.createLinearGradient(x0, 0, ex, ey);
          g.addColorStop(0, withAlpha(col, 0.28 * beam)); g.addColorStop(1, withAlpha(col, 0));
          ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x0 - 4, 0); ctx.lineTo(x0 + 4, 0);
          ctx.lineTo(ex + w * Math.cos(sway), ey - w * Math.sin(sway));

      ctx.globalCompositeOperation = 'source-over';

      ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(angle); ctx.scale(sc, sc);
      ctx.globalAlpha = 0.92; ctx.drawImage(rec, -rec.width / 2, -rec.height / 2); ctx.restore();

          .forEach(([o, a]) => cg.addColorStop(o, `rgba(255,255,255,${a})`));

      ctx.globalCompositeOperation = 'lighter';

      for (let k = rings.length - 1; k >= 0; k--) {
        const r = rings[k]; r.r += d.r * 1.1 * dt; r.a -= dt * 0.55;
        if (r.a <= 0) { rings.splice(k, 1); continue; }
        ctx.strokeStyle = withAlpha(r.col, r.a); ctx.lineWidth = vibe.ring || 3;
        ctx.beginPath(); ctx.arc(d.x, d.y, r.r, 0, 7); ctx.stroke();
      }

      for (let k = sparks.length - 1; k >= 0; k--) {
        const p = sparks[k]; p.life -= dt;

        p.vx *= 1 - dt * 1.2; p.vy = p.vy * (1 - dt * 1.2) + p.g * SCALE * dt;

        ctx.fillStyle = withAlpha(p.col, 0.25 * a); ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 3, 0, 7); ctx.fill();
        ctx.fillStyle = withAlpha(p.col, 0.9 * a); ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.fill();
      }
      // Ambient specks rising at the song's pace; many more during the chorus.
      if (!still) {
        moteAcc += dt * (1.5 + 6 * hype) * speed * (vibe.motes || 1);
        while (moteAcc > 1 && motes.length < 90) {
          moteAcc--;
          motes.push({ x: Math.random() * W, y: H + 8, v: (14 + Math.random() * 26) * SCALE * 2,
            size: 1 + Math.random() * 2.6, ph: Math.random() * 6, col: pick() });
        }
        if (moteAcc > 1) moteAcc = 1;
      }
      for (let k = motes.length - 1; k >= 0; k--) {
        const m = motes[k]; m.y -= m.v * speed * dt; m.ph += dt;
        if (m.y < -10) { motes.splice(k, 1); continue; }
        const x = m.x + Math.sin(m.ph * 1.3) * 10 * SCALE;
        ctx.fillStyle = withAlpha(m.col, 0.45); ctx.beginPath(); ctx.arc(x, m.y, m.size, 0, 7); ctx.fill();

      if ((climax > 0.02 || pieces.length || bolts.length) && !still) drawClimax(dt, d);

      if (flash > 0.01) {

        flash = Math.max(0, flash - dt * 2.5);

        app.style.transform = `translate(${((Math.random() - .5) * shake).toFixed(1)}px, ${((Math.random() - .5) * shake).toFixed(1)}px)`;
        shake = Math.max(0, shake - dt * 40);
        if (shake <= 0.2) app.style.transform = '';
      }

    }
    requestAnimationFrame(frame);

    return {
      setCover(img, pal) { label = img; palette = pal && pal.length ? pal : DEFAULT; dirty = true; },
      setPace(ms) { pace = ms; },
      get pace() { return pace; },
      setVibe(v) { vibe = v; },
      setClimax(on) { climaxTarget = on ? 1 : 0; if (!on) { boltTimer = 0; } },
      // The moment the final chorus lands: one big hit in the vibe's style.
      climaxHit() {
        if (still) return;
        pulse = 1; flash = Math.max(flash, 0.22); shake = vibe.shake * 1.8;
        for (let i = 0; i < 3; i++) rings.push({ r: disc().r * (0.3 + i * 0.25), a: 0.8, col: pick() });
        burst(vibe.chorusSparks * 2, vibe.power * 1.5);
        const kind = vibe.climaxFx;
        if (kind === 'confetti' || kind === 'gold') for (let i = 0; i < 90; i++) { const p = newPiece(kind); p.y = -Math.random() * H * 0.5; pieces.push(p); }

      onLine(line) {

        rings.push({ r: disc().r * 0.4, a: line.chorus ? 0.7 : 0.45, col: pick() });
        if (vibe.doubleRing) rings.push({ r: disc().r * 0.25, a: 0.5, col: pick() });

        shake = vibe.shake * (line.chorus ? 1.4 : 1);

          if (vibe.climaxFx === 'bolts') bolt();
          if (vibe.climaxFx === 'gold') rings.push({ r: disc().r * 0.5, a: 0.75, col: GOLD[0] });

  })();

  // ---------- Album colours ----------
  // Samples the cover, buckets similar colours, and picks the three most common
  // (favouring colourful ones). Background colours are kept dark so white text stays readable;
  // the accent (progress bar, karaoke glow) is kept bright.
  function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;

    if (mx === mn) return [0, 0, l];
    const d = mx - mn, s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    const h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return [h * 60, s, l];
  }
  const hsl = (h, s, l) => `hsl(${h.toFixed(0)} ${(s * 100).toFixed(0)}% ${(l * 100).toFixed(0)}%)`;
  async function applyAlbumColours(url, labelUrl) {
    const root = document.documentElement.style;
    if (!url) { root.removeProperty('--accent'); fx.setCover(null, null); return; }
    try {
      const img = new Image(); img.crossOrigin = 'anonymous'; img.src = url; await img.decode();
      const c = document.createElement('canvas'); c.width = c.height = 24;
      const x = c.getContext('2d'); x.drawImage(img, 0, 0, 24, 24);
      const data = x.getImageData(0, 0, 24, 24).data, buckets = new Map();
      for (let i = 0; i < data.length; i += 4) {
        const [h, s, l] = rgbToHsl(data[i], data[i + 1], data[i + 2]);
        const key = s < .15 ? 'grey' + Math.round(l * 4) : Math.round(h / 24) + ':' + Math.round(l * 3);
        const b = buckets.get(key) || { n: 0, h: 0, s: 0, l: 0 };
        b.n++; b.h += h; b.s += s; b.l += l; buckets.set(key, b);
      }
      const cols = [...buckets.values()].map(b => ({ h: b.h / b.n, s: b.s / b.n, l: b.l / b.n, n: b.n }))
        .sort((a, b) => b.n * (0.4 + b.s) - a.n * (0.4 + a.s));
      while (cols.length < 3) cols.push(cols[0] || { h: 240, s: .2, l: .2 });
      const vivid = [...cols].sort((a, b) => b.s - a.s)[0];
      root.setProperty('--accent', hsl(vivid.h, Math.max(vivid.s, .55), .62));
      // Bright versions of the cover's colours for the light show.
      const palette = cols.slice(0, 4).map(c => hsl(c.h, Math.max(c.s, c.s < .15 ? 0 : .6), c.s < .15 ? .8 : .62));
      palette.unshift(hsl(vivid.h, Math.max(vivid.s, .6), .62));
      // Bigger copy of the cover for the record label.
      const big = new Image(); big.crossOrigin = 'anonymous'; big.src = labelUrl || url;
      await big.decode().catch(() => {});
      fx.setCover(big.naturalWidth ? big : img, palette);
    } catch (e) { /* keep the previous colours if the cover can't be read */ }
  }

  async function seekTo(ms) {
    state.progress = Math.max(0, ms - offset); state.at = performance.now(); follow = true;
    await spotify('/me/player/seek?position_ms=' + Math.round(state.progress), 'PUT');
  }

  function tick() {
    const pos = state.progress + (state.playing ? performance.now() - state.at : 0);
    $('bar').firstElementChild.style.width = Math.min(100, pos / state.duration * 100) + '%';
    if (lines && lines.length) {
      const p = pos + offset;
      let i = -1;
      for (let k = 0; k < lines.length && lines[k].t <= p; k++) i = k;
      if (i !== activeIdx) {
        lineEls.forEach((el, k) => { el.classList.toggle('active', k === i); el.classList.toggle('past', k < i); });
        // Only react to the song moving forward one line (not to seeks or sync nudges).
        setClimax(i >= 0 && !!lines[i].climax);
        if (i >= 0 && i === activeIdx + 1) {
          fx.onLine(lines[i]);
          if (lines[i].climaxStart) fx.climaxHit(); // the big moment as the final chorus lands
        }
        activeIdx = i;
        if (follow && i >= 0) {
          const el = lineEls[i], box = $('lyrics');
          const scrollToActive = () => {
            if (!follow || activeIdx !== i) return;
            lastAutoScroll = performance.now();
            // Centre the current line at 42% of the lyrics area (measured inside the lyrics box,
            // not from the top of the app, so the header no longer pushes it up).
            box.scrollTop = (el.offsetTop - box.offsetTop) - (box.clientHeight * 0.42 - el.offsetHeight / 2);
          };
          scrollToActive();
          // Lines change size over the 0.3s font-size transition; re-aim once they've settled.
          setTimeout(scrollToActive, 350);
        }
      }
    }
    requestAnimationFrame(tick);
  }

  // ---------- Song changes ----------
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const songData = new Map(); // trackId -> Promise of [lyrics, genres]; shared by prefetch and switch
  function loadSong(t) {
    if (!songData.has(t.id)) {
      songData.set(t.id, Promise.all([fetchLyrics(t), genreInfo(t).catch(() => ({ tags: [], it: '' }))]));
      // Warm the image cache too (same CORS mode the colour sampler uses).
      for (const im of t.album?.images || []) { const i = new Image(); i.crossOrigin = 'anonymous'; i.src = im.url; }
    }
    return songData.get(t.id);
  }

  // Load the next song in the queue ahead of time, so skipping is instant.
  let upNext = null;
  async function prefetchNext() {
    try {
      const q = await spotify('/me/player/queue');
      const n = q?.queue?.[0];
      upNext = n && n.type === 'track' ? n : null;
      if (upNext) loadSong(upNext);
    } catch (e) { upNext = null; }
  }

  let switchToken = 0;
  async function switchTrack(t) {
    const token = ++switchToken;
    state.trackId = t.id;
    const data = loadSong(t);
    let ready = false; data.then(() => { ready = true; });
    // 1. Old song slides out.
    $('lyrics').classList.remove('entering');
    $('lyrics').classList.add('switching'); $('meta').classList.add('swap'); $('art').classList.add('swap');
    await sleep(260);
    if (token !== switchToken) return;
    // 2. New title and cover slide in (cover waits until it has loaded, so it never flashes empty).
    $('title').textContent = t.name;
    $('artist').textContent = t.artists.map(a => a.name).join(', ');
    $('meta').classList.remove('swap');
    const img = t.album?.images?.[0]?.url || '';
    $('art').src = img; $('art').style.visibility = img ? 'visible' : 'hidden';
    $('bgArt').style.backgroundImage = img ? `url("${img}")` : '';
    (img ? $('art').decode().catch(() => {}) : Promise.resolve()).then(() => { if (token === switchToken) $('art').classList.remove('swap'); });
    applyAlbumColours(t.album?.images?.at(-1)?.url || img, t.album?.images?.[1]?.url || img);
    // 3. Only show the loader if the lyrics aren't ready almost straight away.
    if (!ready) await Promise.race([data, sleep(250)]);
    if (token !== switchToken) return;
    if (!ready) { showLoader(); $('lyrics').classList.remove('switching'); }
    const [res, genres] = await data;
    if (token !== switchToken) return;
    // 4. New lyrics rise in.
    $('lyrics').classList.add('switching');
    renderLyrics(res); // also sets the singing pace used below
    setVibe(vibeOverride[t.id] || classify(genres, res.synced ? fx.pace : 3500));
    void $('lyrics').offsetWidth;
    $('lyrics').classList.remove('switching'); $('lyrics').classList.add('entering');
    setTimeout(() => { if (token === switchToken) $('lyrics').classList.remove('entering'); }, 1000);
    prefetchNext();
  }

  let pollTimer = null, polling = false;
  async function poll() {
    if (polling) return;
    polling = true; clearTimeout(pollTimer);
    try {
      const d = await spotify('/me/player/currently-playing');
      const t = d && d.item;
      if (!t || d.currently_playing_type !== 'track') {
        if (state.trackId !== null) { state.trackId = null; switchToken++; $('title').textContent = 'Nothing playing';
          $('artist').textContent = 'Start a song on Spotify'; $('vibe').classList.add('hidden'); showMsg('Waiting for Spotify…'); }
      } else {
        // Right after an on-page skip Spotify can still report the old song for a moment: don't bounce back.
        const settling = t.id !== state.trackId && performance.now() < skipGuardUntil;
        if (!settling) {
          state.progress = d.progress_ms; state.at = performance.now();
          state.playing = d.is_playing; state.duration = t.duration_ms;
          if (t.id !== state.trackId) switchTrack(t);
        }
      }
    } catch (e) { /* network blip, try again next poll */ }
    polling = false;
    pollTimer = setTimeout(poll, document.hidden ? 5000 : 1000);
  }
  // Check with Spotify again soon (after a skip), instead of waiting for the next regular poll.
  const pollSoon = (ms = 350) => { clearTimeout(pollTimer); pollTimer = setTimeout(poll, ms); };

  // Skip buttons on the page: switch to the prefetched song straight away, then confirm with Spotify.
  let skipGuardUntil = 0;
  function skip(dir) {
    clearTimeout(pollTimer);
    spotify(dir > 0 ? '/me/player/next' : '/me/player/previous', 'POST').finally(() => pollSoon());
    if (dir > 0 && upNext) {
      skipGuardUntil = performance.now() + 2000;
      state.progress = 0; state.at = performance.now(); state.duration = upNext.duration_ms;
      switchTrack(upNext); upNext = null;
    }
  }

  function bind() {
    $('smaller').onclick = () => { fs = Math.max(24, fs - 4); applyFs(); };
    $('bigger').onclick = () => { fs = Math.min(96, fs + 4); applyFs(); };
    $('earlier').onclick = () => { offset -= 500; applyOffset(); activeIdx = -2; };
    $('later').onclick = () => { offset += 500; applyOffset(); activeIdx = -2; };
    $('follow').onclick = () => { follow = true; activeIdx = -2; };
    $('play').onclick = () => { spotify(state.playing ? '/me/player/pause' : '/me/player/play', 'PUT');
      state.progress += state.playing ? performance.now() - state.at : 0; state.at = performance.now(); state.playing = !state.playing; };
    $('next').onclick = () => skip(1);
    $('prev').onclick = () => skip(-1);
    $('logout').onclick = () => { ['access', 'refresh', 'expires'].forEach(store.del); location.reload(); };
    // Tap the style badge to try the next style for this song (if the guess is off).
    $('vibe').onclick = () => {
      const next = VIBE_ORDER[(VIBE_ORDER.indexOf(vibeKey) + 1) % VIBE_ORDER.length];
      if (state.trackId) vibeOverride[state.trackId] = next;
      setVibe(next);
      if (lineEls[activeIdx]) { // replay the pop so the new style shows straight away
        const el = lineEls[activeIdx]; el.classList.remove('active'); void el.offsetWidth; el.classList.add('active');
        fx.onLine(lines[activeIdx]);
      }
    };
    // Manual scroll pauses auto-follow; the ⤓ button resumes it.
    const stopFollow = () => { if (performance.now() - lastAutoScroll > 700) follow = false; };
    $('lyrics').addEventListener('wheel', stopFollow);
    $('lyrics').addEventListener('touchmove', stopFollow);
  }

  // ?demo: shows the layout with placeholder lines, no Spotify login needed.
  function startDemo() {
    $('app').classList.remove('hidden');
    applyFs(); applyOffset(); bind();
    $('title').textContent = 'Demo track'; $('artist').textContent = 'Tesla Lyrics';
    $('art').style.visibility = 'hidden';
    setVibe(new URLSearchParams(location.search).get('vibe') || 'pop'); // e.g. ?demo&vibe=metal
    const words = ['This is a demo of the lyrics screen', 'Each line lights up in time', 'Then scrolls up out of the way',
      'Use the sync buttons if words run early', 'Or late compared to the song', 'Connect Spotify to see real songs'];
    const synced = words.map((text, i) => ({ t: 1000 + i * 2500, text }));
    const demoClimax = new URLSearchParams(location.search).has('climax'); // ?demo&vibe=metal&climax
    const loop = () => { state = { trackId: 'demo', progress: 0, at: performance.now(), playing: true, duration: 17000 };
      renderLyrics({ synced });
      if (demoClimax) synced.forEach((l, i) => { l.climax = i >= 2; l.climaxStart = i === 2; }); };
    loop(); setInterval(loop, 17000);
    requestAnimationFrame(tick);
  }

  async function main() {
    $('redirectUri').textContent = REDIRECT;
    $('clientId').value = store.get('client_id') || '';
    $('connect').onclick = () => { const id = $('clientId').value.trim(); if (id) startLogin(id); };

    const q = new URLSearchParams(location.search);
    if (q.has('demo')) return startDemo();
    if (q.get('code') && q.get('state') !== store.get('state')) {
      $('setupErr').textContent = 'Login check failed, please tap Connect again.';
      history.replaceState(null, '', REDIRECT);
    } else if (q.get('code')) {
      try {
        await tokenRequest({ grant_type: 'authorization_code', code: q.get('code'),
          redirect_uri: REDIRECT, code_verifier: store.get('verifier') });
      } catch (e) { $('setupErr').textContent = e.message; }
      history.replaceState(null, '', REDIRECT);
    } else if (q.get('error')) {
      $('setupErr').textContent = 'Spotify said: ' + q.get('error');
      history.replaceState(null, '', REDIRECT);
    }

    if (!store.get('refresh')) { $('setup').classList.remove('hidden'); return; }
    $('app').classList.remove('hidden');
    applyFs(); applyOffset(); bind();
    poll(); requestAnimationFrame(tick);
  }
  main();
})();
</script>
</body>
</html>
